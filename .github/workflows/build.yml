name: Build APK

# Builds the signed APK and publishes it as the latest release, so
# https://github.com/AmrKhaledNaser/tasweef-android/releases/latest/download/tasweef.apk
# (the link on tasweef.web.app/app) always serves the newest build.
on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_PASSWORD secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Version
        run: |
          # the first APK (PWABuilder) was version code 1
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'my-key-alias' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk tasweef.apk
          ls -la tasweef.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: تسويف ${{ env.VERSION_NAME }} للأندرويد
          body: |
            تطبيق تسويف للأندرويد، ومعه تنزيل الفيديو والصوت على الهاتف مباشرة.
            حمّله من https://tasweef.web.app/app ثم افتحه واسمح بالتثبيت. يُثبَّت فوق النسخة السابقة دون أن تضيع بياناتك.
          files: tasweef.apk
          make_latest: true
