name: Build APK

# Builds the signed APK and publishes it as the latest release, so
# https://github.com/AmrKhaledNaser/tasweef-android/releases/latest/download/tasweef.apk
# (the link on tasweef.web.app/app) always serves the newest build.
on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets yet (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD): this build only checks the code and is not published."
            echo "SIGNED=0" >> "$GITHUB_ENV"
          else
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Version
        run: |
          # the first APK (PWABuilder) was version code 1
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          # the shown version stays 1.0.0 while the app is in testing; the build number still grows so updates install
          echo "VERSION_NAME=1.0.0" >> "$GITHUB_ENV"
          echo "TAG=1.0.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: QuickJS for YouTube's JS challenges
        run: |
          # yt-dlp now needs a JavaScript engine to read YouTube videos quickly; without one it falls back to a
          # slow path (about 15 s before a download starts). QuickJS-ng is small, built here for each processor,
          # and packed as libqjs.so so Android installs it as an executable next to Python and ffmpeg.
          git clone -q --depth 1 -b v0.14.0 https://github.com/quickjs-ng/quickjs "$RUNNER_TEMP/qjs"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S "$RUNNER_TEMP/qjs" -B "$RUNNER_TEMP/qjs-$abi" -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=24 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF > /dev/null
            cmake --build "$RUNNER_TEMP/qjs-$abi" --target qjs_exe -j4 > /dev/null
            mkdir -p app/src/main/jniLibs/$abi
            cp "$RUNNER_TEMP/qjs-$abi/qjs" app/src/main/jniLibs/$abi/libqjs.so
            echo "::notice::libqjs.so $abi $(stat -c %s app/src/main/jniLibs/$abi/libqjs.so) bytes"
          done

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'my-key-alias' }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            # forgive a pasted label ("Key store password: …"), quotes, spaces or line breaks around the values
            clean() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[^:]*[Pp]assword[^:]*: *//; s/^["'"'"' ]+//; s/["'"'"' ]+$//'; }
            export KEYSTORE_PASSWORD="$(clean "$KEYSTORE_PASSWORD")"
            export KEY_PASSWORD="$(clean "$KEY_PASSWORD")"
            [ -n "$KEY_PASSWORD" ] || export KEY_PASSWORD="$KEYSTORE_PASSWORD"
            [ ${#KEYSTORE_PASSWORD} -eq 12 ] && [ ${#KEY_PASSWORD} -eq 12 ] || echo "::warning::A password secret does not look like the 12-character one from signing-key-info.txt."
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "::notice::keystore $(stat -c %s "$RUNNER_TEMP/release.keystore") bytes (expected 2708)"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk tasweef.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk tasweef-32bit.apk
          # read by the app's self-updater (releases/latest/download/version.json)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          printf '{"code":%s,"name":"%s","url":"%s/tasweef.apk","size":%s,"url32":"%s/tasweef-32bit.apk","size32":%s}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$base" "$(stat -c %s tasweef.apk)" "$base" "$(stat -c %s tasweef-32bit.apk)" > version.json
          cat version.json
          echo "::notice::tasweef.apk $(stat -c %s tasweef.apk) bytes, tasweef-32bit.apk $(stat -c %s tasweef-32bit.apk) bytes, version $VERSION_NAME ($VERSION_CODE), signed=$SIGNED"

      - name: Show build errors
        if: failure()
        run: |
          # surface the compiler / Gradle errors as annotations (readable without opening the log)
          if [ -f build.log ]; then
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi

      # The download link on tasweef.web.app points here: GitHub Pages serves the file itself, from one
      # address, as an Android app (application/vnd.android.package-archive), so Chrome just downloads it.
      # A release link instead passes through github.com and a redirect, and phones often stall on it.
      - name: Publish the download files (GitHub Pages)
        if: env.SIGNED == '1'
        run: |
          mkdir -p site && cp tasweef.apk tasweef-32bit.apk version.json site/ && touch site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://tasweef.web.app/app/">' > site/index.html
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "APK $VERSION_NAME ($VERSION_CODE)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Publish release
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: تسويف ${{ env.VERSION_NAME }} للأندرويد (بناء ${{ github.run_number }})
          body: |
            تطبيق تسويف للأندرويد، ومعه تنزيل الفيديو والصوت على الهاتف مباشرة.
            tasweef.apk لمعظم الهواتف، وtasweef-32bit.apk للهواتف القديمة إن لم يُثبَّت الأول.
            حمّله من https://tasweef.web.app/app ثم افتحه واسمح بالتثبيت. يُثبَّت فوق النسخة السابقة دون أن تضيع بياناتك.
          files: |
            tasweef.apk
            tasweef-32bit.apk
            version.json
          make_latest: true
